# Render Blueprint: New > Blueprint, pick this repo, then paste the keys when asked.
# The Postgres database below is created with the app and linked through DATABASE_URL;
# it holds cases, rules, incidents and seller accounts.
databases:
  - name: rebuttal-db
    plan: free
    databaseName: rebuttal
    user: rebuttal

services:
  - type: web
    name: rebuttal
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start # binds to $PORT (see package.json)
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Opens on the simulator so judges can try every step; the inbox switches to the
      # live PayPal sandbox when the PayPal keys below are set.
      - key: PAYPAL_MODE
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      # Seller accounts: the database, and the key that encrypts sellers' PayPal secrets
      # (Render generates a random one; keep it, or every seller has to reconnect PayPal).
      - key: DATABASE_URL
        fromDatabase:
          name: rebuttal-db
          property: connectionString
      - key: REBUTTAL_SECRET_KEY
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Optional
      - key: GEMINI_MODEL
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
